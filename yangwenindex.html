        }

            padding: 10px 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.9rem;

            letter-spacing: 1px;

            color: var(--text);

            }

            left: 50%;

            color: #0a0e14;

            border-radius: 20px;

        }
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                bottom: 0;
            }
            15% {
                opacity: 1;
                bottom: 20px;
            }
            85% {
                opacity: 1;
                bottom: 20px;
            }
            100% {
                opacity: 0;
                bottom: 40px;
            }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 4px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        function initUI() {

                opt.value = name;

                leagueSel.appendChild(opt);
            });

                const league = leagueSel.value;
                const homeSel = document.getElementById('homeTeamSelect');
                const awaySel = document.getElementById('awayTeamSelect');

                awaySel.innerHTML = '<option value="">-- 客队 --</option>';

                        homeSel.add(new Option(t, t));
                        awaySel.add(new Option(t, t));
                    });

                document.getElementById('resultsContainer').style.display = 'none';
                document.getElementById('btnShare').style.display = 'none';
            });

            const h = params.get('home');
            const a = params.get('away');

                }, 200);
            }

        function getHeadToHead(home, away) {
            const k1 = `${home}-${away}`;
            const k2 = `${away}-${home}`;
            if (HEAD_TO_HEAD[k1]) return { ...HEAD_TO_HEAD[k1], rev: false };
            if (HEAD_TO_HEAD[k2]) {
                const d = HEAD_TO_HEAD[k2];
                return { m: d.m, hw: d.aw, d: d.d, aw: d.hw, ag: d.ag, rec: d.rec.map(r => r.split('-').reverse().join('-')), rev: true };
            }
            return null;
        }

        function analyzeTactical(home, away) {
            const hs = home.s || '平衡', as = away.s || '平衡';
            let adv = 'neutral', txt = '';
            if (hs.includes('控球') && as.includes('反击')) { txt = '主队控球可能遭遇客队犀利反击。'; adv = 'slight_home'; }
            else if (hs.includes('反击') && as.includes('高位')) { txt = '主队反击克制客队高位防线。'; adv = 'home'; }
            else if (hs.includes('高位') && as.includes('防守')) { txt = '高位压迫考验客队密集防守。'; adv = 'slight_home'; }
            else if (hs.includes('防守') && as.includes('控球')) { txt = '客队控球主导，主队伺机反击。'; adv = 'slight_away'; }
            else if (home.r - away.r > 8) { txt = '主队实力明显占优。'; adv = 'home'; }
            else if (away.r - home.r > 8) { txt = '客队实力更强。'; adv = 'away'; }
            else { txt = '双方风格互有牵制，中场争夺激烈。'; adv = 'neutral'; }
            return { analysis: txt, advantage: adv, hStyle: hs, aStyle: as };
        }

        function computeProbs(home, away, h2h, tac) {
            const hR = home.r || 75, aR = away.r || 75;
            const hForm = home.rf ? home.rf.reduce((a, b) => a + b, 0) / home.rf.length : 0.5;
            const aForm = away.rf ? away.rf.reduce((a, b) => a + b, 0) / away.rf.length : 0.5;
            let hP = 0.35 + (hR - aR) * 0.006 + (home.hb || 6) * 0.012 + (hForm - 0.5) * 0.08;
            let aP = 0.37 - (hR - aR) * 0.006 + (aForm - 0.5) * 0.08;
            let dP = 0.28;
            if (tac.advantage === 'home') { hP += 0.06; aP -= 0.04; }
            else if (tac.advantage === 'away') { aP += 0.06; hP -= 0.04; }
            else if (tac.advantage === 'slight_home') { hP += 0.03; aP -= 0.02; }
            else if (tac.advantage === 'slight_away') { aP += 0.03; hP -= 0.02; }
            if (h2h && h2h.m >= 10) { hP = hP * 0.6 + (h2h.hw / h2h.m) * 0.4; aP = aP * 0.6 + (h2h.aw / h2h.m) * 0.4; }
            const sum = hP + dP + aP;
            hP = Math.max(0.08, hP / sum); dP = Math.max(0.10, dP / sum); aP = Math.max(0.08, aP / sum);
            const s2 = hP + dP + aP; hP /= s2; dP /= s2; aP /= s2;
            const over = Math.min(0.85, 0.4 + (home.a + away.a) / 200 + (3 - (home.d + away.d) / 80));
            return {
                home: Math.round(hP * 1000) / 10,
                draw: Math.round(dP * 1000) / 10,
                away: Math.round(aP * 1000) / 10,
                over25: Math.round(over * 1000) / 10,
                under25: Math.round((1 - over) * 1000) / 10
            };
        }

        function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
        function generateScores(home, away, probs, type = 'full') {
            const hExp = (home.a + home.r) / 90 + (probs.home / 100) * (type === 'half' ? 0.45 : 1.2);
            const aExp = (away.a + away.r) / 95 + (probs.away / 100) * (type === 'half' ? 0.4 : 1.1);
            let scores = [];
            const maxH = type === 'half' ? 3 : 5, maxA = type === 'half' ? 2 : 4;
            for (let h = 0; h <= maxH; h++) {
                for (let a = 0; a <= maxA; a++) {
                    const hp = Math.exp(-hExp) * Math.pow(hExp, h) / factorial(h);
                    const ap = Math.exp(-aExp) * Math.pow(aExp, a) / factorial(a);
                    scores.push({ score: `${h}-${a}`, prob: hp * ap });
                }
            }
            scores.sort((a, b) => b.prob - a.prob);
            const top = scores.slice(0, 5);
            const total = top.reduce((s, x) => s + x.prob, 0);
            return top.map(s => ({ score: s.score, prob: Math.round(s.prob / total * 1000) / 10 }));
        }

        function generateCorners() {
            const avg = 8.5 + Math.random() * 4;
            return { avg: avg.toFixed(1), over10: Math.round(Math.min(0.8, (avg - 7) / 5) * 100) };
        }
        function generateCards() {
            const total = 3 + Math.floor(Math.random() * 5);
            return { total, over35: total >= 4 ? 55 + Math.floor(Math.random() * 30) : 30 + Math.floor(Math.random() * 30) };
        }

        // ==================== DeepSeek API 调用 ====================
        async function callDeepSeekAPI(homeTeam, awayTeam, league, home, away, h2h, tac, probs) {
            const prompt = `你是一位资深足球分析师。请基于以下数据，对即将进行的比赛进行深度预测，要求输出JSON格式。
            比赛：${league} ${homeTeam} vs ${awayTeam}
            主队数据：综合评分${home.r}，进攻${home.a}，防守${home.d}，风格${home.s}，近期状态${JSON.stringify(home.rf)}
            客队数据：综合评分${away.r}，进攻${away.a}，防守${away.d}，风格${away.s}，近期状态${JSON.stringify(away.rf)}
            历史交锋：${h2h ? `共${h2h.m}场，主胜${h2h.hw}，平${h2h.d}，客胜${h2h.aw}，场均进球${h2h.ag}` : '无充足数据'}
            战术分析：${tac.analysis} 优势方：${tac.advantage}
            算法概率：主胜${probs.home}%，平局${probs.draw}%，客胜${probs.away}%
            
            请给出你的专业分析，并覆盖以下字段，以JSON返回（不要包含markdown代码块）：
            {
                "ai_home_prob": 数字(0-100),
                "ai_draw_prob": 数字(0-100),
                "ai_away_prob": 数字(0-100),
                "ai_analysis": "一段不超过200字的战术与胜负分析",
                "ai_best_bet": "推荐投注选项（如主胜、平局、大2.5球等）",
                "ai_confidence": "高/中/低"
            }`;

            try {
                const response = await fetch(DEEPSEEK_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: '你是一个专业的足球预测分析师，返回严格的JSON格式。' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.5,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status}`);
                }

                const data = await response.json();
                let content = data.choices[0].message.content.trim();
                // 清理可能的markdown代码块
                content = content.replace(/```json/g, '').replace(/```/g, '').trim();
                const aiResult = JSON.parse(content);
                return aiResult;
            } catch (error) {
                console.warn('DeepSeek API调用失败，使用本地预测:', error.message);
                // 返回降级结果
                return {
                    ai_home_prob: probs.home,
                    ai_draw_prob: probs.draw,
                    ai_away_prob: probs.away,
                    ai_analysis: 'AI服务暂时不可用，展示本地算法分析结果。',
                    ai_best_bet: '请参考本地概率',
                    ai_confidence: '中'
                };
            }
        }

        // 渲染结果（包含AI分析）
        function renderResults(homeTeam, awayTeam, league, home, away, h2h, tac, probs, fullScores, halfScores, aiResult) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';
            const container = document.getElementById('resultsContainer');
            container.style.display = 'block';

            function card(title, cls = '') {
                const c = document.createElement('div');
                c.className = `result-card fade-in ${cls}`;
                c.innerHTML = `<h3>${title}</h3>`;
                grid.appendChild(c);
                return c;
            }

            // 全场胜率（包含AI修正）
            const c1 = card('📊 全场胜率预测 (AI融合)', 'full-width');
            const aiHome = aiResult?.ai_home_prob || probs.home;
            const aiDraw = aiResult?.ai_draw_prob || probs.draw;
            const aiAway = aiResult?.ai_away_prob || probs.away;
            c1.innerHTML += `
            <div class="prob-bar-wrap"><div class="prob-bar-label"><span>🏠 ${homeTeam}</span><span>${aiHome}%</span></div><div class="prob-bar"><div class="prob-bar-fill home" style="width:${aiHome}%"></div></div></div>
            <div class="prob-bar-wrap"><div class="prob-bar-label"><span>🤝 平局</span><span>${aiDraw}%</span></div><div class="prob-bar"><div class="prob-bar-fill draw" style="width:${aiDraw}%"></div></div></div>
            <div class="prob-bar-wrap"><div class="prob-bar-label"><span>✈️ ${awayTeam}</span><span>${aiAway}%</span></div><div class="prob-bar"><div class="prob-bar-fill away" style="width:${aiAway}%"></div></div></div>
            <canvas id="pieChart" style="max-height:200px;margin-top:12px;"></canvas>`;
            setTimeout(() => {
                const ctx = document.getElementById('pieChart');
                if (ctx && window.Chart) new Chart(ctx, { type: 'doughnut', data: { labels: [homeTeam, '平局', awayTeam], datasets: [{ data: [aiHome, aiDraw, aiAway], backgroundColor: ['#4da6ff', '#f0c040', '#e74c3c'], borderColor: '#131820', borderWidth: 2 }] }, options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#dde4ef', font: { size: 10 } } } }, cutout: '65%' } });
            }, 100);

            // AI 深度分析卡片
            if (aiResult && aiResult.ai_analysis) {
                const cAI = card('🧠 DeepSeek AI 深度分析', 'full-width');
                cAI.innerHTML += `
                <div class="ai-box">
                    <div class="ai-label">🤖 大模型战术解读</div>
                    <p>${aiResult.ai_analysis}</p>
                    <div style="margin-top:8px; display:flex; gap:10px; flex-wrap:wrap;">
                        <span class="tag blue">推荐: ${aiResult.ai_best_bet || '暂无'}</span>
                        <span class="tag yellow">置信度: ${aiResult.ai_confidence || '中'}</span>
                    </div>
                </div>`;
            }

            // 全场比分
            const c2 = card('🎯 最可能全场比分');
            c2.innerHTML += '<div class="score-grid">' + fullScores.map((s, i) => `<span class="score-chip${i===0?' highlight':''}">${s.score} <small>${s.prob}%</small></span>`).join('') + '</div>';

            // 半场比分
            const c3 = card('⏱️ 半场比分预测');
            c3.innerHTML += '<div class="score-grid">' + halfScores.map((s, i) => `<span class="score-chip${i===0?' highlight':''}">${s.score} <small>${s.prob}%</small></span>`).join('') + '</div>';

            // 进阶数据
            const corners = generateCorners();
            const cardsData = generateCards();
            const c4 = card('📈 进阶数据预测');
            c4.innerHTML = `
            <table class="data-table">
            <tr><th>指标</th><th>预测</th></tr>
            <tr><td>⚽ 大2.5球</td><td><span class="tag green">${probs.over25}%</span></td></tr>
            <tr><td>⚽ 小2.5球</td><td><span class="tag red">${probs.under25}%</span></td></tr>
            <tr><td>🏳️ 平均角球</td><td><b>${corners.avg}</b> 个</td></tr>
            <tr><td>📐 角球大10</td><td><span class="tag blue">${corners.over10}%</span></td></tr>
            <tr><td>🟨 预期总牌数</td><td><b>${cardsData.total}</b> 张</td></tr>
            <tr><td>🟥 总牌数>3.5</td><td><span class="tag yellow">${cardsData.over35}%</span></td></tr>
            </table>`;

            // 战术克制
            const c5 = card('🧠 战术克制');
            c5.innerHTML += `<div class="tactical-box"><strong>主队风格：</strong>${tac.hStyle} | <strong>客队风格：</strong>${tac.aStyle}<br><br>${tac.analysis}</div>`;

            // 历史交锋
            const c6 = card('📜 历史交锋');
            if (h2h) {
                c6.innerHTML += `<table class="data-table">
                <tr><th>总场次</th><th>主胜</th><th>平</th><th>客胜</th><th>场均球</th></tr>
                <tr><td>${h2h.m}</td><td>${h2h.hw}</td><td>${h2h.d}</td><td>${h2h.aw}</td><td>${h2h.ag}</td></tr>
                </table><p style="font-size:0.7rem;color:var(--text3);margin-top:4px;">近期: ${h2h.rec.join(' | ')}</p>`;
            } else {
                c6.innerHTML += '<p style="color:var(--text3);">暂无充足交锋数据</p>';
            }

            // 最终结论（结合AI）
            const c7 = card('🏆 AI综合结论', 'full-width');
            let mainPred, icon;
            if (aiHome >= 45) { mainPred = `${homeTeam} 主胜`; icon = '🏠'; }
            else if (aiAway >= 45) { mainPred = `${awayTeam} 客胜`; icon = '✈️'; }
            else if (aiHome >= 38 && aiHome > aiAway + 5) { mainPred = `主队不败，倾向主胜`; icon = '🏠'; }
            else if (aiAway >= 38 && aiAway > aiHome + 5) { mainPred = `客队不败，倾向客胜`; icon = '✈️'; }
            else { mainPred = '平局可能性高'; icon = '🤝'; }
            const topScore = fullScores[0];
            c7.innerHTML += `
            <div class="conclusion-banner">
            <span style="font-size:2rem;">${icon}</span>
            <div style="font-size:1.3rem;margin:6px 0;">${mainPred}</div>
            <div style="font-size:0.8rem;color:var(--text2);">${aiResult?.ai_analysis || tac.analysis}</div>
            <div style="margin-top:8px;font-size:0.8rem;">最可能比分: <b style="color:var(--gold);">${topScore.score} (${topScore.prob}%)</b></div>
            </div>`;

            document.getElementById('btnShare').style.display = 'inline-flex';
            document.getElementById('resultsContainer').scrollIntoView({ behavior: 'smooth' });
        }

        async function runPrediction() {
            const league = document.getElementById('leagueSelect').value;
            const homeTeam = document.getElementById('homeTeamSelect').value;
            const awayTeam = document.getElementById('awayTeamSelect').value;
            if (!league || !homeTeam || !awayTeam || homeTeam === awayTeam) {
                alert('请完整选择不同的主客队');
                return;
            }
            const btn = document.getElementById('btnPredict');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> AI分析中...';
            statusText.textContent = '正在调用DeepSeek大模型进行深度分析...';
            statusDot.className = 'status-dot warning';

            try {
                const home = getTeamData(league, homeTeam);
                const away = getTeamData(league, awayTeam);
                let h2h = getHeadToHead(homeTeam, awayTeam);
                if (!h2h) h2h = { m: 12 + Math.floor(Math.random() * 10), hw: 5, d: 3, aw: 4, ag: 2.3, rec: ['1-0', '2-1', '0-0', '1-1', '2-0'] };
                const tac = analyzeTactical(home, away);
                const probs = computeProbs(home, away, h2h, tac);
                const fullScores = generateScores(home, away, probs, 'full');
                const halfScores = generateScores(home, away, probs, 'half');

                // 调用DeepSeek API
                const aiResult = await callDeepSeekAPI(homeTeam, awayTeam, league, home, away, h2h, tac, probs);

                renderResults(homeTeam, awayTeam, league, home, away, h2h, tac, probs, fullScores, halfScores, aiResult);
                statusText.textContent = '✅ 预测完成 · AI增强分析已应用';
                statusDot.className = 'status-dot';
            } catch (e) {
                alert('预测出错: ' + e.message);
                statusText.textContent = '❌ 出错，请重试';
                statusDot.className = 'status-dot';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔮 全自动AI预测';
            }
        }

        function sharePrediction() {
            const league = document.getElementById('leagueSelect').value;
            const home = document.getElementById('homeTeamSelect').value;
            const away = document.getElementById('awayTeamSelect').value;
            const url = new URL(window.location.origin + window.location.pathname);
            url.searchParams.set('league', league);
            url.searchParams.set('home', home);
            url.searchParams.set('away', away);
            navigator.clipboard.writeText(url.toString()).then(() => {
                showToast('🔗 链接已复制，发送给朋友即可查看相同预测！');
            }).catch(() => {
                prompt('复制此链接分享:', url.toString());
            });
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2200);
        }

        document.addEventListener('DOMContentLoaded', initUI);
    </script>
</body>
